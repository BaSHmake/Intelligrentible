<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Intelligrentible</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center;
    background: #111; font-family: 'Courier New', monospace; color: #fff; padding: 10px;
  }
  .game-container {
    background: #222; padding: 15px; border-radius: 12px;
    box-shadow: 0 0 40px rgba(0,255,0,0.1); text-align: center;
    width: 100%; max-width: 440px; position: relative;
  }
  canvas { display: block; margin: 0 auto; background: #1a1a1a; border: 2px solid #444; border-radius: 8px; touch-action: none; width: 100%; max-width: 400px; height: auto; }
  .hud { display: flex; justify-content: space-between; align-items: center; padding: 10px 4px; font-size: 16px; letter-spacing: 1px; }
  .lives span { color: #ff4444; font-size: 20px; margin-right: 2px; }
  button { background: #2a5a2a; color: #fff; border: 2px solid #4a4; padding: 10px 20px; font-family: inherit; font-size: 16px; border-radius: 8px; cursor: pointer; margin-top: 10px; }
  button:active { transform: scale(0.97); }
  .msg { margin-top: 10px; font-size: 14px; color: #ccc; min-height: 20px; }
  .record { margin-top: 6px; font-size: 13px; color: #ffd700; }
</style>
</head>
<body>
<div class="game-container">
  <div class="hud">
    <div class="lives"><span>❤</span><span id="livesDisplay">❤❤❤</span></div>
    <div>Очки: <span id="scoreDisplay">0</span></div>
  </div>

  <canvas id="gameCanvas" width="400" height="500"></canvas>

  <div class="msg" id="message">Нажмите «Начать»</div>
  <div class="record" id="recordText">🏆 Рекорд: 0</div>

  <button id="startBtn">Начать / Заново</button>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const livesDisplay = document.getElementById('livesDisplay');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const recordText = document.getElementById('recordText');
  const messageEl = document.getElementById('message');

  const LANES = 3;
  const LANE_WIDTH = canvas.width / LANES;
  
  const PLAYER_HEIGHT = 160; 
  const PLAYER_WIDTH = PLAYER_HEIGHT * (1042 / 1563); 
  const PLAYER_Y = canvas.height - PLAYER_HEIGHT / 2 - 10; 
  
  const ITEM_SIZE = 40; 

  // ===== ЗАГРУЗКА КАРТИНОК =====
  const heroBase = new Image(); heroBase.src = 'Проект (20261026122800).png'; 
  const heroIdle2 = new Image(); heroIdle2.src = 'Проект (20261027080835).png';
  const heroHappy = new Image(); heroHappy.src = 'Проект (20261026050007).png';
  const heroHurt = new Image(); heroHurt.src = 'Проект (20261029115742).png';

  // Массив кадров смерти (добавил первый кадр вручную и твои из списка)
  const deathFrameNames = [
    'Проект (20261029115742).png', // 1. Трещины
    'Проект (20261029044439).png', // 2. Отвалилась рука
    'Проект (20261029064708).png', // 3. Сильный распад
    'Проект (20261030014019).png', // 4. Почти исчез
    'Проект (20261030015847).png', // 5. Осколки
    'Проект (20261030020518).png'  // 6. Лужа
  ];
  
  const deathImages = [];
  let deathImagesLoaded = 0;
  
  deathFrameNames.forEach((name, index) => {
    const img = new Image();
    img.src = name;
    img.onload = () => { deathImagesLoaded++; };
    deathImages.push(img);
  });

  let heroLoaded = false, idle2Loaded = false, happyLoaded = false, hurtLoaded = false;
  heroBase.onload = () => { heroLoaded = true; };
  heroIdle2.onload = () => { idle2Loaded = true; };
  heroHappy.onload = () => { happyLoaded = true; };
  heroHurt.onload = () => { hurtLoaded = true; };

  // ===== СОСТОЯНИЕ ИГРЫ =====
  let playerLane = 1;
  let lives = 3;
  let score = 0;
  let items = [];
  let running = false;
  let gameOver = false;
  let spawnInterval = null;
  
  let happyTimer = 0; 
  let hurtTimer = 0;
  let idleTimer = 0; 
  
  // Переменные для кат-сцены смерти
  let isDying = false;
  let deathFrameIndex = 0;
  let deathFrameTimer = 0;
  
  let shake = 0;
  let flash = 0;

  let record = parseInt(localStorage.getItem('intelligrentibleRecord') || '0', 10);
  recordText.textContent = record;

  // ===== УПРАВЛЕНИЕ =====
  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); }, { passive: false });
  canvas.addEventListener('touchend', (e) => {
    if (!running || gameOver) return;
    const touchEndX = e.changedTouches[0].clientX;
    const rect = canvas.getBoundingClientRect();
    const tapX = (touchEndX - rect.left) * (canvas.width / rect.width);
    const tappedLane = Math.floor(tapX / LANE_WIDTH);
    if (tappedLane >= 0 && tappedLane < LANES) playerLane = tappedLane;
    e.preventDefault();
  }, { passive: false });

  document.getElementById('startBtn').addEventListener('click', startGame);

  // ===== ИГРА =====
  function startGame() {
    if (spawnInterval) clearInterval(spawnInterval);
    playerLane = 1;
    lives = 3;
    score = 0;
    items = [];
    running = true;
    gameOver = false;
    isDying = false;
    deathFrameIndex = 0;
    deathFrameTimer = 0;
    happyTimer = 0;
    hurtTimer = 0;
    idleTimer = 0;
    shake = 0;
    flash = 0;
    updateHUD();
    messageEl.textContent = 'Ловите мусор!';
    
    spawnInterval = setInterval(() => {
      if (!running || gameOver) return;
      const lane = Math.floor(Math.random() * LANES);
      items.push({ lane: lane, y: -ITEM_SIZE, speed: 3.5 });
    }, 800);

    requestAnimationFrame(gameLoop);
  }

  function updateHUD() {
    livesDisplay.textContent = '❤'.repeat(lives) || '💀';
    scoreDisplay.textContent = score;
  }

  function gameLoop() {
    // Если игра окончена и анимация проиграна - останавливаем цикл
    if (gameOver && !isDying) return; 
    
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  function update() {
    if (shake > 0.5) { shake *= 0.85; if (shake < 0.5) shake = 0; }
    if (flash > 0.01) { flash *= 0.88; if (flash < 0.01) flash = 0; }

    // ЛОГИКА КАТ-СЦЕНЫ СМЕРТИ
    if (isDying) {
      deathFrameTimer++;
      // Меняем кадр каждые 15 фреймов (примерно 0.25 сек)
      if (deathFrameTimer > 15) {
        deathFrameTimer = 0;
        deathFrameIndex++;
        
        // Если кадры закончились - показываем результат
        if (deathFrameIndex >= deathImages.length) {
          isDying = false;
          if (score > record) {
            record = score;
            localStorage.setItem('intelligrentibleRecord', record);
            recordText.textContent = record;
            messageEl.textContent = `🏆 Новый рекорд: ${score}!`;
          } else {
            messageEl.textContent = `💀 Конец! Очки: ${score}.`;
          }
        }
      }
      return; // Пока умираем - мусор не двигаем
    }

    if (gameOver) return;

    if (happyTimer > 0) happyTimer--;
    if (hurtTimer > 0) hurtTimer--;
    
    idleTimer++;
    if (idleTimer > 60) idleTimer = 0;

    for (let i = items.length - 1; i >= 0; i--) {
      const item = items[i];
      item.y += item.speed;
      
      const itemX = item.lane * LANE_WIDTH + LANE_WIDTH / 2;
      const playerX = playerLane * LANE_WIDTH + LANE_WIDTH / 2;

      if (item.y + ITEM_SIZE >= PLAYER_Y - PLAYER_HEIGHT / 2 && item.y <= PLAYER_Y + PLAYER_HEIGHT / 2 &&
          Math.abs(itemX - playerX) < LANE_WIDTH * 0.4) {
        score += 10;
        updateHUD();
        items.splice(i, 1);
        happyTimer = 20; 
        hurtTimer = 0; 
        continue;
      }

      if (item.y > canvas.height) {
        lives--;
        updateHUD();
        items.splice(i, 1);
        
        happyTimer = 0;
        hurtTimer = 20; 
        shake = 15;
        flash = 0.8;

        if (lives <= 0) {
          gameOver = true;
          isDying = true; // Запускаем кат-сцену
          deathFrameIndex = 0;
          deathFrameTimer = 0;
          if (spawnInterval) clearInterval(spawnInterval);
          return;
        }
      }
    }
  }

  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(-50, -50, canvas.width + 100, canvas.height + 100);

    for (let i = 0; i <= LANES; i++) {
      ctx.beginPath(); ctx.strokeStyle = '#333'; ctx.lineWidth = 1;
      ctx.moveTo(i * LANE_WIDTH, 0); ctx.lineTo(i * LANE_WIDTH, canvas.height);
      ctx.stroke();
    }

    items.forEach(item => {
      const x = item.lane * LANE_WIDTH + LANE_WIDTH / 2 - ITEM_SIZE / 2;
      ctx.fillStyle = '#888';
      ctx.beginPath(); ctx.arc(x + ITEM_SIZE / 2, item.y + ITEM_SIZE / 2, ITEM_SIZE / 2, 0, Math.PI * 2); ctx.fill();
    });

    const px = playerLane * LANE_WIDTH + LANE_WIDTH / 2;
    
    // ЛОГИКА ОТРИСОВКИ ГЕРОЯ
    if (isDying) {
      // Рисуем кадр смерти строго по центру экрана
      if (deathImages[deathFrameIndex] && deathImages[deathFrameIndex].complete) {
        const deadWidth = PLAYER_WIDTH;
        const deadHeight = PLAYER_HEIGHT;
        // Отрисовка по центру (canvas.width / 2)
        ctx.drawImage(deathImages[deathFrameIndex], canvas.width / 2 - deadWidth / 2, PLAYER_Y - deadHeight / 2, deadWidth, deadHeight);
      }
    } else if (gameOver) {
      // Если анимация закончилась, оставляем последний кадр или пустоту
      if (deathImages[deathImages.length - 1] && deathImages[deathImages.length - 1].complete) {
        ctx.globalAlpha = 0.5; // Делаем полупрозрачным, как призрак
        ctx.drawImage(deathImages[deathImages.length - 1], canvas.width / 2 - PLAYER_WIDTH / 2, PLAYER_Y - PLAYER_HEIGHT / 2, PLAYER_WIDTH, PLAYER_HEIGHT);
        ctx.globalAlpha = 1;
      }
    } else if (hurtTimer > 0 && hurtLoaded) {
      ctx.drawImage(heroHurt, px - PLAYER_WIDTH / 2, PLAYER_Y - PLAYER_HEIGHT / 2, PLAYER_WIDTH, PLAYER_HEIGHT);
    } else if (happyTimer > 0 && happyLoaded) {
      ctx.drawImage(heroHappy, px - PLAYER_WIDTH / 2, PLAYER_Y - PLAYER_HEIGHT / 2, PLAYER_WIDTH, PLAYER_HEIGHT);
    } else if (idleTimer > 30 && idle2Loaded && heroLoaded) {
      ctx.drawImage(heroIdle2, px - PLAYER_WIDTH / 2, PLAYER_Y - PLAYER_HEIGHT / 2, PLAYER_WIDTH, PLAYER_HEIGHT);
    } else if (heroLoaded) {
      ctx.drawImage(heroBase, px - PLAYER_WIDTH / 2, PLAYER_Y - PLAYER_HEIGHT / 2, PLAYER_WIDTH, PLAYER_HEIGHT);
    } else {
      ctx.fillStyle = '#3aa0a0'; ctx.fillRect(px - PLAYER_WIDTH / 2, PLAYER_Y - PLAYER_HEIGHT / 2, PLAYER_WIDTH, PLAYER_HEIGHT);
    }

    if (flash > 0) {
      ctx.fillStyle = `rgba(255, 0, 0, ${flash})`;
      ctx.fillRect(-50, -50, canvas.width + 100, canvas.height + 100);
    }

    ctx.restore();
  }

  draw();
</script>
</body>
</html>
